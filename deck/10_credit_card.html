<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebulack - Arbitraje de Stablecoins en Solana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            /*padding: 40px 20px;*/
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            /*box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);*/
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00d4ff, #090979);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.3rem;
            /*color: rgba(255, 255, 255, 0.9);*/
            margin-bottom: 15px;
        }

        .description {
            font-size: 1.1rem;
            /*color: rgba(255, 255, 255, 0.8);*/
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .timeline-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
			text-align: center;
            /*padding: 40px 20px;¨*/
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            /*box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);*/
        }

        .timeline-title {
            text-align: center;
            font-size: 2.5rem;
            /*color: #fff;*/
            margin-bottom: 40px;
            font-weight: 700;
        }

        .timeline {
            position: relative;
            display: flex;
            overflow-x: auto;
            padding: 40px 0;
            scroll-behavior: smooth;
        }

        .timeline::before {
            content: '';
            position: absolute;
            /*top: 50%;*/
			width:400%;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #090979, #00d4ff);
            border-radius: 2px;
            z-index: 1;
        }

        .timeline-item {
            position: relative;
            min-width: 280px;
            margin: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .timeline-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00d4ff, #090979);
            border: 4px solid /*#fff*/;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            position: relative;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .timeline-item.current .timeline-dot {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .timeline-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            min-height: 180px;
        }

        .timeline-content:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .timeline-step {
            font-size: 0.9rem;
            /*color: rgba(255, 255, 255, 0.7);*/
            margin-bottom: 10px;
            font-weight: 600;
        }

        .timeline-title-item {
            font-size: 1.1rem;
            /*color: #fff;*/
            margin-bottom: 10px;
            font-weight: 700;
            line-height: 1.3;
        }

        .timeline-description {
            font-size: 0.9rem;
            /*color: rgba(255, 255, 255, 0.8);*/
            line-height: 1.4;
        }

        .current-badge {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: inline-block;
        }
		.current-badge2 {
			background: linear-gradient(45deg, #ff6b6b, #ee5a24);
			left: 53%;
			color: white;
			position: fixed;
			padding: 5px 15px;
			border-radius: 20px;
			font-size: 0.8rem;
			width: 10%;
			font-weight: 600;
			margin-bottom: 10px;
		}
		
        .advantages-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .advantages-title {
            text-align: center;
            font-size: 2.5rem;
            /*color: #fff;*/
            margin-bottom: 40px;
            font-weight: 700;
        }

        .advantages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .advantage-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .advantage-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .advantage-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .advantage-title {
            font-size: 1.3rem;
            /*color: #fff;*/
            margin-bottom: 15px;
            font-weight: 600;
        }

        .advantage-description {
            /*color: rgba(255, 255, 255, 0.8);*/
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .tech-stack {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .tech-stack-title {
            font-size: 1.5rem;
            /*color: #fff;*/
            margin-bottom: 20px;
            font-weight: 600;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .tech-tag {
            background: linear-gradient(45deg, #00d4ff, #090979);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: transform 0.2s ease;
        }

        .tech-tag:hover {
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .timeline {
                padding: 20px 0;
            }
            
            .timeline-item {
                min-width: 250px;
                margin: 0 15px;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            .timeline-title, .advantages-title {
                font-size: 2rem;
            }
            
            .advantages-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
